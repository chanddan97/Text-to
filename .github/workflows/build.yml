name: Auto Unzip & Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files (If ZIP uploaded)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found ZIP file, extracting..."
            unzip -o *.zip -d extracted_project
            # Move files to root if they are inside a subfolder or directly in extracted_project
            shopt -s dotglob
            if [ -f "extracted_project/settings.gradle.kts" ] || [ -f "extracted_project/settings.gradle" ]; then
              mv extracted_project/* .
            else
              SUBDIR=$(find extracted_project -maxdepth 2 -name "settings.gradle*" -printf '%h\n' | head -n 1)
              if [ -n "$SUBDIR" ]; then
                mv "$SUBDIR"/* .
              fi
            fi
            rm -rf extracted_project *.zip
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle & Build Debug APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      
      - name: Compile Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Studio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
