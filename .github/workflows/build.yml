name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip AI Studio File (Including Hidden .env Files)
        run: |
          shopt -s dotglob
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Unzipping $f ..."
              unzip -o "$f" -d temp_dir
              rm -f "$f"
              cp -rn temp_dir/* . || true
              for d in temp_dir/*/; do
                if [ -d "$d" ]; then
                  cp -rn "$d"* . || true
                fi
              done
              rm -rf temp_dir
            fi
          done
          # Ensure .env.example and .env exist so Gradle never fails!
          touch .env.example .env local.properties
          if [ -d "app" ]; then
            touch app/.env.example app/.env
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Studio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
